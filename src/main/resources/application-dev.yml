# Local dev profile - matches the two-container setup in the guide (§14 Phase 0, step E).
# docker run --name g7-workorder-db -e MYSQL_ROOT_PASSWORD=devpassword \
#   -e MYSQL_DATABASE=work_order_db -p 3307:3306 -d mysql:8.0
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/work_order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:devpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

usm:
  dev-tools:
    enabled: true
