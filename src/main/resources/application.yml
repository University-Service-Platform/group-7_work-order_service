spring:
  application:
    name: work-order-service
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

usm:
  dev-tools:
    enabled: false
  jwt:
    secret: ${JWT_SECRET:"sprint1-placeholder-dev-secret-key-change-me-before-anything-real-CHANGE"}
    issuer: ${JWT_ISSUER:"usm-g7-dev"}
    expiration-minutes: 60

services:
  identity:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8001}
    jwks-uri: ${services.identity.base-url}/.well-known/jwks.json
    issuer: university-identity-service
    audience: university-services-platform
  service-request:
    base-url: ${SERVICE_REQUEST_BASE_URL:http://localhost:8081}
  group6-facility:
    base-url: ${GROUP6_FACILITY_SERVICE_BASE_URL:${GROUP6_FACILITY_BASE_URL:http://localhost:9091}}
    enforce-validation: ${GROUP6_FACILITY_ENFORCE_VALIDATION:false}

logging:
  level:
    com.usm.workorder: INFO
